workflows:
  ios-screenshots:
    name: iOS Screenshots
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - test_login
    triggering:
      events: []          # manual trigger only — start it from the dashboard when you want screenshots
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS app for Simulator
        script: |
          flutter build ios --simulator --no-codesign

      - name: Install Maestro
        script: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "PATH=$HOME/.maestro/bin:$PATH" >> $CM_ENV

      - name: Sign the simulator build
        script: |
          set -e
          cat > /tmp/sim.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>FAKETEAMID.com.ancfabrics.app</string>
            <key>keychain-access-groups</key>
            <array>
              <string>FAKETEAMID.com.ancfabrics.app</string>
            </array>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - --entitlements /tmp/sim.entitlements \
            build/ios/iphonesimulator/Runner.app

      # App Store Connect needs one iPhone 6.9" set and — because this app
      # ships for iPad too (TARGETED_DEVICE_FAMILY "1,2") — one iPad 13" set.
      # Both runs use the same Maestro flow, so the two sets show the same
      # screens, each with a clean 9:41 status bar the way Apple's own store
      # imagery does.
      - name: Capture iPhone 6.9 inch screenshots
        script: |
          bash tool/capture_app_store_screenshots.sh iphone-6.9 "iPhone 17 Pro Max,iPhone 16 Pro Max,iPhone 15 Pro Max"

      - name: Capture iPad 13 inch screenshots
        script: |
          bash tool/capture_app_store_screenshots.sh ipad-13 "iPad Pro 13-inch (M4),iPad Pro (12.9-inch) (6th generation)"

      - name: Report captured sizes
        script: |
          echo "Screenshots produced:"
          find screenshots -name '*.png' | while read -r f; do
            echo "$f -> $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr -d ' ')"
          done

    artifacts:
      - screenshots/**/*.png

  ios-device-build:
    name: iOS Device Build (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []          # manual trigger only — start it from the dashboard
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build unsigned iOS app for device
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/ipa_build/Payload"
          cp -r build/ios/iphoneos/Runner.app "$CM_BUILD_DIR/ipa_build/Payload/"
          cd "$CM_BUILD_DIR/ipa_build"
          zip -r "$CM_BUILD_DIR/najjar_mobile-unsigned.ipa" Payload
          cd "$CM_BUILD_DIR"
          ls -la najjar_mobile-unsigned.ipa
    artifacts:
      - najjar_mobile-unsigned.ipa
