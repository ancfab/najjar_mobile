name: anc_fabrics
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+9

environment:
  sdk: ^3.10.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  http_parser: ^4.1.2
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  # Generates the native (pre-Flutter) launch screen from the branded
  # artwork, so the logo is on screen from the moment the app is tapped
  # rather than after the Flutter engine has started.
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/translation/
    - assets/logo/ANC Logo.png
    # The mark alone, on transparency, for the Home header — the full logo
    # file carries its own opaque backdrop, which showed as a pale panel
    # against the header.
    - assets/logo/anc_mark.png
    # Arabic-capable TTF loaded by OrderPdfService as a PDF font fallback:
    # the built-in PDF base fonts carry no Arabic glyphs, so a customer
    # name or address coming back from Business Central in Arabic would
    # otherwise render blank. Not registered as a Flutter font family —
    # the app's own UI uses the system Arabic font, this is for generated
    # documents only. Noto Naskh Arabic, SIL Open Font License (see
    # assets/fonts/OFL.txt).
    - assets/fonts/NotoNaskhArabic.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"
  # Android 8+ masks the launcher icon to the launcher's own shape (circle,
  # squircle, ...) and zooms it, so the adaptive foreground is a separate,
  # far more padded rendering of the mark on a white background — without
  # it the gold square's edges get cropped by the mask.
  adaptive_icon_background: "assets/logo/icon_background.png"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"
  # iOS icons may not carry an alpha channel; icon.png is already opaque,
  # and this flattens anything that slips through.
  remove_alpha_ios: true
  min_sdk_android: 21
# Native launch screen: the full branded artwork, shown from the moment the
# app is tapped until the first Flutter frame (the login screen, or Home for
# a restored session). background_image rather than `image` so the artwork
# fills the screen instead of sitting as a small centred logo.
flutter_native_splash:
  color: "#D9D9D9"
  background_image: "assets/logo/splash.png"
  fullscreen: true
  android_12:
    # Android 12+ draws its own splash: a masked icon on a solid colour, so
    # the mark is supplied on its own rather than the full artwork.
    image: "assets/logo/icon_foreground.png"
    color: "#D9D9D9"
